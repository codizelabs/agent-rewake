# OpenSSF Scorecard: rates the project's security practices and publishes the result
#. Skipped while the repository is private.
name: scorecard

on:
  push:
    branches: [develop]
  schedule:
    - cron: "23 5 * * 2"
  branch_protection_rule:
  workflow_dispatch:

# Scorecard's publishing rules: no workflow-level write permissions, and only the Scorecard job
# may use id-token.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository being scored
      actions: read # read workflow runs (the CI-Tests and Dangerous-Workflow checks)
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
