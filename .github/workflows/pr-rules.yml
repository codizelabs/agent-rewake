# Checks that apply to every pull request, whatever it changes.
name: pr-rules

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          # main only takes releases: pull requests from develop.
          if [ "$BASE" = "main" ]; then
            if [ "$BRANCH" = "develop" ]; then
              echo "Release pull request: develop into main"
              exit 0
            fi
            echo "::error::Pull requests into main come only from develop (a release). Open this one against develop instead; see CONTRIBUTING.md (Releasing)."
            exit 1
          fi
          # <type>/<short-kebab-description>, or a branch made by an automated tool.
          pattern='^((feat|fix|docs|chore|ci|refactor|test|perf|release)/[a-z0-9][a-z0-9._-]*|(dependabot|claude)/.+)$'
          if printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "Branch name ok: $BRANCH"
          else
            echo "::error::Branch \"$BRANCH\" doesn't follow the naming rule in CONTRIBUTING.md (Branches): <type>/<description>, where type is feat, fix, docs, chore, ci, refactor, test, perf or release, and the description is lowercase with dashes. Example: fix/missed-repeat-runs"
            exit 1
          fi

  # A change people can see (src/, site/src/) comes with a CHANGELOG.md entry, unless the pull
  # request is labelled no-changelog (plan §10A.3).
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a changelog entry for visible changes
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if printf '%s' "$LABELS" | grep -q '"no-changelog"'; then
            echo "Labelled no-changelog: skipped."
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if ! printf '%s\n' "$changed" | grep -Eq '^(src|site/src)/'; then
            echo "No change under src/ or site/src/: nothing to record."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error::This pull request changes src/ or site/src/ but not CHANGELOG.md. Add a line under [Unreleased] saying what changes for people, or label the pull request no-changelog if nothing visible changes."
          exit 1
