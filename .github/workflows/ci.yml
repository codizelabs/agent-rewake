# Type-check, lint, test and build the package, and check what would be published.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish (a deploy is never cut off).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check, lint, test, build
        run: npm run check

      - name: Check npm package contents
        run: npm run check:pack

  # The single status check to require in branch rulesets: it fails if any matrix job failed or
  # was cancelled, and passes only when all of them passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every matrix job to pass
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check result: $RESULT"
          test "$RESULT" = "success"
