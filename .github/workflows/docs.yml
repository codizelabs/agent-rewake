# Documentation and workflow checks: Markdown lint, internal links, workflow lint and
# workflow security. Code checks live in ci.yml.
name: docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays: check external links too
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish (a deploy is never cut off).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      # Offline mode checks relative links and #anchors between files in this
      # repository. External URLs are not fetched, so the check can't flake.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path 'node_modules'
            --exclude-path 'site'
            './**/*.md'
          fail: true

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Plain mode: findings fail this check (SARIF upload needs Advanced Security).
          advanced-security: false

  # External links rot without anyone touching the docs, so check them weekly. Informational:
  # not a required check, because other sites' outages must not block merges.
  links-online:
    name: links (online)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path 'node_modules'
            --exclude-path 'site'
            './**/*.md'
          fail: true
          token: ${{ github.token }}
