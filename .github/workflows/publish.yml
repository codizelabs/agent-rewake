# Publishes the npm package with npm trusted publishing (OIDC): no npm token is stored anywhere.
#   develop: stages a prerelease (X.Y.Z-next.<run>, dist-tag "next") with `npm stage publish`.
#            Nothing is installable until a maintainer approves it on npmjs.com with 2FA.
#   main:    publishes the version in package.json with `npm publish` (dist-tag "latest") if it
#            isn't on npm yet, then tags the commit vX.Y.Z and creates the GitHub release.
# Setup (once, on npmjs.com, package settings > Trusted Publisher > GitHub Actions), two entries:
#   codizelabs / agent-rewake / publish.yml / environment "npm-stage" / stage publish only
#   codizelabs / agent-rewake / publish.yml / environment "npm"       / allow npm publish
# The GitHub environments limit "npm-stage" to develop and "npm" to main
# (scripts/apply-github-settings.mjs).
name: publish

on:
  push:
    branches: [main, develop]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - scripts/build.mjs
      - tsconfig.json
      - README.md
      - LICENSE
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: stage (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-stage
    permissions:
      contents: read
      id-token: write # OIDC token that npm exchanges for a short-lived publish token
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 bundles npm 11.19+ (staged publishing needs 11.15, trusted publishing 11.5.1).
      # No dependency cache in a publishing job (cache poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false


      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check, lint, test, build
        run: npm run check

      - name: Check npm package contents
        run: npm run check:pack

      # A version can be staged only once, so each run stages its own prerelease. If the version in
      # package.json is already released, the prerelease is for the next patch version.
      - name: Choose the prerelease version
        id: version
        env:
          RUN: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          name=$(node -p "require('./package.json').name")
          base=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$base" version 2>/dev/null || true)" ]; then
            base=$(node -p "const [a, b, c] = process.argv[1].split('.'); [a, b, Number(c) + 1].join('.')" "$base")
          fi
          version="$base-next.$RUN"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage on npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm stage publish --tag next
          {
            echo "### Staged $VERSION"
            echo "Approve or reject it on npmjs.com (Staged Packages tab), or with"
            echo "\`npm stage list\` and \`npm stage approve <id>\`. Approved, it installs as \`@next\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token that npm exchanges for a short-lived publish token
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 bundles npm 11.19+ (staged publishing needs 11.15, trusted publishing 11.5.1).
      # No dependency cache in a publishing job (cache poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false


      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check, lint, test, build
        run: npm run check

      - name: Check npm package contents
        run: npm run check:pack

      # Publishes only a version that isn't on npm yet: merging without a version bump is a no-op.
      - name: Publish on npm
        id: publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --tag latest
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "### Published $name@$version" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the vX.Y.Z tag and the release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release notes: the version's section of CHANGELOG.md, or generated notes without one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
