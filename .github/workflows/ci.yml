# Type-check, lint, test and build the package, and check what would be published.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  # Nightly (plan §10.5): the whole set on three systems, the package smoke test and the offline
  # end-to-end loop, against develop as it is, so a change elsewhere (a runner, an npm release)
  # shows up the next morning.
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish (a deploy is never cut off).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check, lint, test, build
        run: npm run check

      - name: Check npm package contents
        run: npm run check:pack

  # The package as people get it (plan §10A.3 tarball-smoke): packed, installed on its own into an
  # empty folder, and run. Nothing but the .tgz: no repository files, no dev dependencies.
  tarball-smoke:
    name: tarball-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pack, install the .tgz alone, and run it
        shell: bash
        run: node scripts/tarball-smoke.mjs "$RUNNER_TEMP/rewake-smoke"

  # The whole loop in Zed's Agent Panel against the real Claude adapter and Claude Code, offline:
  # a local mock of Anthropic's API, and macOS's sandbox denying every other connection
  # (test/claude-loop.test.ts; plan §10.2 L3, §10A.3 e2e-hosts).
  e2e-hosts:
    name: e2e-hosts (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Limit, resume, same session, once
        env:
          REWAKE_E2E: "1"
        run: npx vitest run test/claude-loop.test.ts

  # The single status check to require in branch rulesets: it fails if any matrix job failed or
  # was cancelled, and passes only when all of them passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, tarball-smoke, e2e-hosts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every matrix job to pass
        env:
          RESULT: ${{ needs.check.result }}
          SMOKE: ${{ needs.tarball-smoke.result }}
          E2E: ${{ needs.e2e-hosts.result }}
        run: |
          echo "check: $RESULT; tarball-smoke: $SMOKE; e2e-hosts: $E2E"
          test "$RESULT" = "success"
          test "$SMOKE" = "success"
          test "$E2E" = "success"
