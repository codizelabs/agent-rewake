# Labels pull requests by the files they change (.github/labeler.yml).
name: labeler

# pull_request_target so fork PRs get a token that can add labels. Safe here: this workflow never
# checks out or runs the pull request's code, it only reads the list of changed files. A change to
# .github/labeler.yml takes effect after it is merged.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read # read .github/labeler.yml from the base branch
      pull-requests: write # add labels to the pull request
    steps:
      - name: Label by changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
