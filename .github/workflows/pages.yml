# Builds the documentation site (site/, Astro Starlight) on every PR and push, checks its links,
# and deploys it to GitHub Pages from main. GitHub Pages isn't available for private repositories
# on a free account, so the deploy job only runs once the repository is public.
name: pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish (a deploy is never cut off).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # "Last updated" dates come from Git history

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build
        working-directory: site
        env:
          # Public ownership tags for Google and Bing, set by the owner
          # as repository variables. Empty until then, and the tags are left out.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Serve the output under its real base path, then check every internal link and #anchor.
      # --index-files: a link to /page/#anchor is checked against /page/index.html.
      - name: Arrange output under the base path
        run: |
          mkdir -p "$RUNNER_TEMP/site-check"
          cp -R site/dist "$RUNNER_TEMP/site-check/agent-rewake"

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --index-files index.html
            --root-dir ${{ runner.temp }}/site-check
            '${{ runner.temp }}/site-check/agent-rewake/**/*.html'
          fail: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the after-deploy script
      pages: write # publish the site to GitHub Pages
      id-token: write # OIDC token that deploy-pages uses to prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Best effort, never fails the deploy: submit the pages to IndexNow (Bing and others) and
      # check that search crawlers get the site.
      - name: Check out (for the after-deploy script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/after-deploy.mjs
            site/public

      - name: Tell search engines and check crawlers
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/after-deploy.mjs
