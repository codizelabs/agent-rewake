# Real one-shot OS timers (launchd, systemd or at, Task Scheduler): each arms a timer for the next
# minute and checks that it runs once and is removed. Slow, so it runs when timer code changes,
# weekly, and on demand, not on every pull request.
name: timers

on:
  pull_request:
    paths:
      - "src/timers/**"
      - "test/timers-os.test.ts"
      - ".github/workflows/timers.yml"
  schedule:
    - cron: "17 2 * * *" # nightly, with ci.yml (plan §10.5)
  workflow_dispatch:

permissions: {}

concurrency:
  group: timers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  os-timer:
    name: os-timer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Arm a real timer and wait for it
        env:
          REWAKE_OS_TIMERS: "1"
        run: npx vitest run test/timers-os.test.ts
