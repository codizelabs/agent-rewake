name: Feature request
description: Propose new behaviour or a change to existing behaviour.
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Agent Rewake works within what Zed and the Agent Client Protocol allow, and some requests aren't possible from an add-on.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Who is affected, and how much
      description: How often it happens, and what it costs you when it does.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen, from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other tools handle this.
