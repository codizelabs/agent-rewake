# Blocks pull requests that add a dependency with a known vulnerability or an incompatible
# license. Free on public repositories; skipped while
# private.
name: dependency-review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the dependency changes
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Licenses compatible with distributing Agent Rewake under Apache-2.0.
          allow-licenses: Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, Python-2.0, CC-BY-4.0
          # Test-only: the Claude Code and GitHub Copilot CLIs pinned in test/agents for the contract
          # and end-to-end tests. They are never bundled or shipped (scripts/check-pack.mjs).
          allow-dependencies-licenses: >-
            pkg:npm/%40anthropic-ai/claude-code,
            pkg:npm/%40anthropic-ai/claude-code-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-code-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-code-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-code-win32-x64,
            pkg:npm/%40github/copilot,
            pkg:npm/%40github/copilot-darwin-arm64,
            pkg:npm/%40github/copilot-darwin-x64,
            pkg:npm/%40github/copilot-linux-arm64,
            pkg:npm/%40github/copilot-linux-x64,
            pkg:npm/%40github/copilot-linuxmusl-arm64,
            pkg:npm/%40github/copilot-linuxmusl-x64,
            pkg:npm/%40github/copilot-win32-arm64,
            pkg:npm/%40github/copilot-win32-x64
